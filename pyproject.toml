[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kerfgrid"
version = "0.1.0"
description = "Local-first plasma nesting and QtPlasmaC CAM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ezdxf==1.4.4",
  "pyclipper==1.4.0",
  "shapely==2.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
kerfgrid = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["plasma_cam*"]

[tool.setuptools.package-data]
plasma_cam = ["data/cut_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
